name: Setup Node and pnpm
description: Install Node from .nvmrc and pnpm with dependency cache

runs:
  using: composite
  steps:
    - id: nvmrc
      shell: bash
      run: printf 'node_version=%s\n' "$(tr -d '\n' < .nvmrc)" >> "$GITHUB_OUTPUT"

    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v5
      with:
        node-version: ${{ steps.nvmrc.outputs.node_version }}
        cache: pnpm